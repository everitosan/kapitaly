name: Sitio
run-name: Sitio ${{ github.ref_name }}

# Publica site/ (política de privacidad) en GitHub Pages.
# Sin workflow_dispatch: solo funciona con workflows que ya están en main.
on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Instalar dependencias
        working-directory: site
        run: npm ci

      - name: Construir
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}privacidad/
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
